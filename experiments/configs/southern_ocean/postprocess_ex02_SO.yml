dataset:
  input_path: C:/Users/Jacopo/Documents/SIMULATIONS/kinematicParcels/southern_ocean/ex02_SO/ex02_SO.zarr

analysis:
  types:
    - summary
    # - density
    - trajectories

output:
  output_dir: C:/Users/Jacopo/Documents/SIMULATIONS/kinematicParcels/southern_ocean/ex02_SO/postprocessing/ex02_SO

exports:
  save_trajectory_table: true
  save_particle_summary: true
  table_format: parquet

cleaning:
  truncate_stagnant: true
  stagnant_tol: 1.0e-6
  stagnant_min_consecutive: 3

grid:
  mode: from_initial_centers
  lon_min: -180.0
  lon_max: 180.0
  lat_min: -80.0
  lat_max: -30.0
  dlon: 1.25
  dlat: 1.25

release:
  mode: region_grid
  continuous: true

density:
  lon_col: lon
  lat_col: lat
  time_col: time
  normalize_active: true
  normalize_total: true

  animate: true
  animation_var: particle_fraction_active
  animation_label: "density [%]"
  animation_fps: 8
  animation_every_n: 1
  show_time_bar: true

trajectories:
  plot: true
  animate: true
  title: "Inner Southern Ocean - trajectories"
  show_start: false
  show_end: true
  plot_color_by: lon0
  plot_cmap: turbo
  plot_cmap_mode: numeric

  animation_fps: 8
  animation_every_n: 4
  animation_color_by: lon0
  animation_cmap: turbo
  animation_cmap_mode: numeric
  animation_label: "initial longitude"
  show_time_bar: true
  trail: true
  trail_steps: 12

plotting:
  projection: SouthPolarStereo