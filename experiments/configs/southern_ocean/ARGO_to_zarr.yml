# Example configuration for converting ARGO CSV files into a Parcels-compatible Zarr dataset.
# Update the input path to match your local ARGO archive before running the converter.

input:
  csv_dir: C:/Users/Jacopo/OneDrive - CNR/ARGO/ACC/csv/subset/
  pattern: PR_PF_*.csv
# input:
#   csv_files:
#     - C:/Users/Jacopo/OneDrive - CNR/ARGO/ACC/PR_PF_1900042.csv

columns:
  platform_code: PLATFORM_CODE
  time: DATE (YYYY-MM-DDTHH:MI:SSZ)
  lat: LATITUDE (degree_north)
  lon: LONGITUDE (degree_east)
  pressure: PRES_ADJUSTED (decibar)

# variables:
#   optional:
#     - TEMP_ADJUSTED (degree_Celsius)
#     - PSAL_ADJUSTED (psu)

processing:
  parking_depth:
    mode: fixed
    value: 1000.0

  segment:
    # mode: split_as_new
    mode: longest
    # mode: ignore
    max_gap_days: 12.0
    min_duration_days: 39.0
    max_speed_km_per_day: 250.0

  regions:
    names_or_labels:
      - iSO
      - oSO
      - ACC
    cut_from_first_entry: true
    input_lon_mode: -180_180

  resample:
    enabled: true
    frequency: 10d
    interpolate: time
    reference_time: 2000-01-01T00:00:00Z
    shared_time: true
    shift_start_to_reference: false

output:
  path: C:/Users/Jacopo/OneDrive - CNR/ARGO/ACC/zarr/SO_not_alligned.zarr