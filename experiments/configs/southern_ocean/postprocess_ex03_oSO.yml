dataset:
  input_path: C:/Users/Jacopo/Documents/SIMULATIONS/kinematicParcels/southern_ocean/ex03_oSO/ex03_oSO.zarr

analysis:
  types:
    # - summary
    # - density
    # - meridional_crossing
    - transition_probability
    # - trajectories

output:
  output_dir: C:/Users/Jacopo/Documents/SIMULATIONS/kinematicParcels/southern_ocean/ex03_oSO/postprocessing/ex03_oSO

exports:
  save_trajectory_table: true
  save_particle_summary: true
  table_format: parquet

cleaning:
  truncate_stagnant: true
  stagnant_tol: 1.0e-6
  stagnant_min_consecutive: 3

grid:
  mode: from_initial_centers
  lon_min: -180.0
  lon_max: 180.0
  lat_min: -80.0
  lat_max: -30.0
  dlon: 2.5
  dlat: 2.5

release:
  mode: region_grid
  continuous: true

density:
  lon_col: lon
  lat_col: lat
  time_col: time
  normalize_active: true
  normalize_total: true

  animate: true
  animation_var: particle_fraction_active
  animation_label: "density [%]"
  animation_fps: 8
  animation_every_n: 1
  show_time_bar: true

trajectories:
  plot: true
  animate: true
  title: "Inner Southern Ocean - trajectories"
  show_start: false
  show_end: true
  plot_color_by: lon0
  plot_cmap: turbo
  plot_cmap_mode: numeric

  animation_fps: 8
  animation_every_n: 4
  animation_color_by: lon0
  animation_cmap: turbo
  animation_cmap_mode: numeric
  animation_label: "initial longitude"
  show_time_bar: true
  trail: true
  trail_steps: 12

plotting:
  projection: SouthPolarStereo

meridional_crossing:
  direction: both
  segmentation:
    lat_filter: rolling_mean
    filter_window: 1
    direction_threshold_deg: 0
    min_segment_duration_days: 0.5
    min_segment_displacement_deg: 0.5
    valid_if: duration_or_displacement
  crossing:
    crossing_latitude_reference: center
    count_once_per_segment_per_lat_bin: true
  output:
    save_netcdf: true
    save_grid_table: true
    save_figures: true
  plotting:
    enabled: true
    show_probability: true
    show_counts: false

transition_probability:
  region_labels:
    - iSO
    - ACC
    - oSO
  time_step_stride: 2
  how_many: priority_max
  priority_level: 2
  priority_mode: exact
  input_lon_mode: "-180_180"
  min_life_days: 0
  trimming_age_days: null
  max_group_member: null  # Set an integer to keep only members <= this value.
  filter_isolated: true   # Replace isolated symbolic labels when neighbors agree.
