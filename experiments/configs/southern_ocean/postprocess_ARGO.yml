dataset:
  input_path: C:/Users/Jacopo/OneDrive - CNR/ARGO/ACC/zarr/subset/ARGO_SO.zarr

analysis:
  types:
    - summary
    - trajectories
    # - density

output:
  output_dir: C:/Users/Jacopo/OneDrive - CNR/ARGO/ACC/zarr/postprocessing/subset/SO/

exports:
  save_trajectory_table: true
  save_particle_summary: true
  table_format: parquet

cleaning:
  truncate_stagnant: false
  stagnant_tol: 1.0e-6
  stagnant_min_consecutive: 3

release:
  mode: point_list
  continuous: false

trajectories:
  plot: true
  animate: false
  title: "Southern Ocean ARGO trajectories"
  show_start: false
  show_end: true
  plot_color_by: lon0
  plot_cmap: turbo
  plot_cmap_mode: numeric

  animation_fps: 8
  animation_every_n: 1
  animation_color_by: lon0
  animation_cmap: turbo
  animation_cmap_mode: numeric
  animation_label: "initial longitude"
  show_time_bar: true
  trail: true
  trail_steps: 12

plotting:
  projection: SouthPolarStereo

