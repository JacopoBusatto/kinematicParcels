dataset:
  input_path: C:/Users/Jacopo/OneDrive - CNR/ARGO/ACC/zarr/SO_not_alligned.zarr

analysis:
  types:
    - summary
    - transition_probability
    - meridional_crossing
    # - trajectories
    # - density

output:
  output_dir: C:/Users/Jacopo/OneDrive - CNR/ARGO/ACC/zarr/postprocessing/SO_not_alligned/

exports:
  save_trajectory_table: true
  save_particle_summary: true
  table_format: parquet

cleaning:
  truncate_stagnant: false
  stagnant_tol: 1.0e-6
  stagnant_min_consecutive: 3

release:
  mode: point_list
  continuous: false

trajectories:
  plot: true
  animate: true
  title: "Southern Ocean ARGO trajectories"
  show_start: false
  show_end: true
  plot_color_by: lon0
  plot_cmap: turbo
  plot_cmap_mode: numeric

  animation_fps: 8
  animation_every_n: 3
  animation_color_by: lon0
  animation_cmap: turbo
  animation_cmap_mode: numeric
  animation_label: "initial longitude"
  show_time_bar: true
  trail: true
  trail_steps: 12

plotting:
  projection: SouthPolarStereo

transition_probability:
  region_labels:
    - iSO
    - ACC
    - oSO
  time_step_stride: 1
  how_many: priority_max
  priority_level: 2
  priority_mode: exact
  input_lon_mode: "-180_180"
  min_life_days: 0
  trimming_age_days: null
  max_group_member: null  # Set an integer to keep only members <= this value.
  filter_isolated: true   # Replace isolated symbolic labels when neighbors agree.

grid:
  mode: explicit_edges
  lon_min: -180.0
  lon_max: 180.0
  lat_min: -80.0
  lat_max: -30.0
  dlon: 1.0
  dlat: 1.0

meridional_crossing:
  direction: both
  segmentation:
    lat_filter: rolling_mean
    filter_window: 1
    direction_threshold_deg: 0
    min_segment_duration_days: 0.5
    min_segment_displacement_deg: 0.5
    valid_if: duration_or_displacement
  crossing:
    crossing_latitude_reference: center
    count_once_per_segment_per_lat_bin: true
  output:
    save_netcdf: true
    save_grid_table: true
    save_figures: true
  plotting:
    enabled: true
    show_probability: true
    show_counts: false

