experiment:
  name: NPstg_multilevel_test
  output_dir: ./outputs

fieldset:
  file_pattern: ./fields/*.nc
  variables:
    U: uo
    V: vo
  dimensions:
    lon: longitude
    lat: latitude
    time: time
    depth: depth
  mesh: spherical

release:
  region_label: NPstg
  dlon: 5.0
  dlat: 5.0
  filter_domain: true

  depth:
    enabled: true
    values: [0, 50, 100]
    mode: snap_to_field          # as_requested | snap_to_field
    request_convention: positive_down
    snap_method: nearest
    remove_duplicate_depths: true

simulation:
  runtime_days: 10
  dt_hours: 1
  outputdt_hours: 24
  particle_type: scipy

output:
  zarr_name: output_NPstg_multilevel.zarr