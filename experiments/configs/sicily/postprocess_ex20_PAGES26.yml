dataset:
  input_path: ./outputs/sicily/ex20_PAGES26_LKM.zarr

analysis:
  types:
    - summary
    - trajectories
    # - density
    # - start_end_regions

output:
  output_dir: ./outputs/sicily/postprocessing/ex20_PAGES26_LKM

exports:
  save_trajectory_table: true
  save_particle_summary: true
  table_format: parquet

cleaning:
  truncate_stagnant: true
  stagnant_tol: 1.0e-6
  stagnant_min_consecutive: 3

grid:
  mode: from_initial_centers
  lon_min: 10.0
  lon_max: 18.0
  lat_min: 35.0
  lat_max: 38.5
  dlon: 0.04
  dlat: 0.04

release:
  mode: circle
  continuous: true

density:
  lon_col: lon
  lat_col: lat
  time_col: time
  normalize_active: true
  normalize_total: true

  animate: true
  animation_var: particle_fraction_active
  animation_label: "density [%]"
  animation_fps: 10
  animation_every_n: 1
  animation_vmin: 0
  animation_vmax: 1.0
  show_time_bar: true

trajectories:
  plot: true
  animate: true
  title: "PAGES26 - trajectories"
  show_start: true
  show_end: true
  plot_color_by: circle_id
  plot_cmap: tab20
  plot_cmap_mode: categorical

  animation_fps: 10
  animation_every_n: 1
  animation_color_by: circle_id
  animation_cmap: tab20
  animation_cmap_mode: categorical
  animation_label: "PG26 stations"
  show_time_bar: true
  trail: true
  trail_steps: 12
  max_group_member: 1

plotting:
  projection: PlateCarree

start_end_regions:
  region_labels:
    - sic
    - sesc
    - sesc-mod
    - sesc-sir
  how_many: priority_max
  priority_level: 7
  priority_mode: exact
  input_lon_mode: "-180_180"
  plot: true

  plot_connectivity: true
  animate_connectivity: true
  connectivity_segments: true
  connectivity_color_by: start_region
  connectivity_label: "start region"
  connectivity_title: "PAGES26 - Sicily LKM"
  connectivity_show_start: false
  connectivity_show_end: true
  connectivity_alpha: 0.3
  connectivity_max_group_member: 1
  connectivity_animation_fps: 6
  connectivity_animation_show_tracer: false
  connectivity_trail: true
  connectivity_trail_steps: 6
