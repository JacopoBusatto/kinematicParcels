experiment:
  name: ex10_lkm_ssu
  output_dir: ./outputs/sicily
output:
  zarr_name: ex10_lkm_ssu_260417-260426.zarr

fieldset:
  file_pattern: ./fields/mfs/hourly/sicily/med_currents_20260*.nc
  periodic_halo: false
  periodic_halo_size: 5
  variables:
    U: uo
    V: vo
  dimensions:
    lon: longitude
    lat: latitude
    time: time
  mesh: spherical

release:
  mode: region_grid
  region_label: ssu
  dlon: 0.1
  dlat: 0.1
  filter_domain: true
  filter_land: true
  continuous:
    enabled: true
    release_interval: 6H
    release_period: 8D

  group:
    size: 2
    radius_km: 3.0
    placement: random

  depth:
    enabled: false
    values: [0]

simulation:
  start_time: "2026-04-17 12:00"
  runtime_days: 8.0
  dt_hours: 0.1
  outputdt_hours: 2.0
  particle_type: scipy

lkm:
  enabled: true
  mode: group_center_of_mass
  L_min_km: 40
  L_max_km: 100.0
  increment_factor: 1.414
  epsilon_tke: 2.0e-9
  c0: 1.0
  phi_mode: constant
  phi_value: 0.78539816339
  update_every_steps: 1
  apply_to_group_size_min: 2
  debug_output: false

