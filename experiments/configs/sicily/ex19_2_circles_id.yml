experiment:
  name: ex19_2_circles
  output_dir: ./outputs/sicily
output:
  zarr_name: ex19_2_circles

fieldset:
  file_pattern: ./fields/mfs/hourly/sicily/med_currents_20260*.nc
  periodic_halo: false
  variables:
    U: uo
    V: vo
  dimensions:
    lon: longitude
    lat: latitude
    time: time
  mesh: spherical

release:
  mode: circle

  circle:
    lat:                [37.70, 37.55]
    lon:                [12.22, 12.24]
    radius_km:          [ 5.00,  5.00]
    count_per_timestep: [3,      3]
    release_interval:   [4H, 4H]
    release_period:     [3D, 3D]
    start_time:         [2026-04-15 12:00, 2026-04-16 12:00]
    dimension: 2D
    sampling: uniform
    seed: 42
    out_of_domain_policy: retry
    bathymetry_policy: drop

  group:
    size: 2
    radius_km: 1.0
    placement: random

  depth:
    enabled: false
    values: [0]

simulation:
  start_time: "2026-04-15 12:00"
  runtime_days: 7.0
  dt_hours: 0.2
  outputdt_hours: 1.0
  particle_type: scipy

lkm:
  enabled: false
  mode: group_center_of_mass
  L_min_km: 40
  L_max_km: 100.0
  increment_factor: 1.414
  epsilon_tke: 2.0e-9
  c0: 1.0
  phi_mode: constant
  phi_value: 0.78539816339
  update_every_steps: 1
  apply_to_group_size_min: 2
  debug_output: false