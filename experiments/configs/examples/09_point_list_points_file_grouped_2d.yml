experiment:
  name: ex09_point_list_points_file_grouped_2d
  output_dir: ./test_output/examples

fieldset:
  file_pattern: ./test_fields/zero_velocity_april_2026.nc
  periodic_halo: false
  periodic_halo_size: 5
  variables:
    U: x_sea_water_velocity
    V: y_sea_water_velocity
  dimensions:
    lon: lon
    lat: lat
    time: time
  mesh: spherical

release:
  mode: point_list
  points_file: ./experiments/configs/examples/data/points_file_grouped_2d.csv
  filter_domain: true
  filter_land: false

  group:
    size: 2

  depth:
    enabled: false
    values: [0]

simulation:
  runtime_days: 2.0
  dt_hours: 0.1
  outputdt_hours: 1.0
  particle_type: scipy

lkm:
  enabled: false

output:
  zarr_name: ex09_point_list_points_file_grouped_2d.zarr
