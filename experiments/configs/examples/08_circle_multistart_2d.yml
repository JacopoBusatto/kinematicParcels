experiment:
  name: ex08_circle_multistart_2d
  output_dir: ./test_output/examples

fieldset:
  file_pattern: ./test_fields/zero_velocity_april_2026.nc
  periodic_halo: false
  variables:
    U: x_sea_water_velocity
    V: y_sea_water_velocity
  dimensions:
    lon: lon
    lat: lat
    time: time
  mesh: spherical

release:
  mode: circle

  circle:
    lat: [36.8, 36.5]
    lon: [15.4, 15.1]
    radius_km: [3.0, 2.0]
    start_time: ["2026-04-03 00:00", "2026-04-02 12:00"]
    count_per_timestep: [10, 10]
    release_interval: [6H, 6H]
    release_period: [1D, 2D]
    dimension: 2D
    sampling: uniform
    seed: 42
    out_of_domain_policy: retry
    bathymetry_policy: drop

  group:
    size: 1

  depth:
    enabled: false
    values: [0]

simulation:
  runtime_days: 3.0
  dt_hours: -0.1
  outputdt_hours: 1.0
  particle_type: scipy

lkm:
  enabled: false

output:
  zarr_name: ex08_circle_multistart_2d.zarr
