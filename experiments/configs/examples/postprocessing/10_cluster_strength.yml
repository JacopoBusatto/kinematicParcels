# Example postprocessing config for the `cluster_strength` analysis.

dataset:
  input_path: ./outputs/test_group_pairs.zarr
  coordinates:
    trajectory: trajectory
    obs: obs
    time: time
    lon: lon
    lat: lat
    z: z

analysis:
  types:
    - cluster_strength

output:
  output_dir: ./outputs/postprocessing/examples/cluster_strength

exports:
  save_trajectory_table: false
  save_particle_summary: true
  table_format: parquet  # parquet | csv

cleaning:
  truncate_stagnant: false
  stagnant_tol: 1.0e-6
  stagnant_min_consecutive: 2

grid:
  mode: explicit_edges  # explicit_edges | from_initial_centers
  lon_min: 13.0
  lon_max: 15.0
  lat_min: 36.0
  lat_max: 38.0
  dlon: 0.1
  dlat: 0.1

release:
  mode: point_list  # point_list | region_grid | circle | lkm
  continuous: false

plotting:
  projection: PlateCarree
  # title_fontsize: 14       # set to 0 to omit titles entirely
  # colorbar_fontsize: 12
  # colorbar_tick_fontsize: 10
  # axis_tick_fontsize: 10

cluster_strength:
  scale_km: 5.0
  distance: haversine  # haversine | euclidean
  cutoff_factor: 4.0
  mask: true
  max_group_member: 1  # Set 1 for single-trajectory diagnostics, or null to keep all members.

  animation:
    enabled: false
    every_release: true
    fixed_age_days: null
    age_tolerance_days: null
    vmin: null
    vmax: null
    min_mask_value: null
    cmap: viridis
    fps: 8
    every_n: 1

  snapshots:
    enabled: false
    fixed_age_days: null
    age_tolerance_days: null
    vmin: null
    vmax: null
    min_mask_value: null
    cmap: viridis
