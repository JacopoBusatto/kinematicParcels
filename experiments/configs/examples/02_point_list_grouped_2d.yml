experiment:
  name: ex02_point_list_grouped_2d
  output_dir: ./test_output/examples

fieldset:
  file_pattern: ./test_fields/zero_velocity_april_2026.nc
  periodic_halo: false
  variables:
    U: x_sea_water_velocity
    V: y_sea_water_velocity
  dimensions:
    lon: lon
    lat: lat
    time: time
  mesh: spherical

release:
  mode: point_list
  points:
    - {lon: 15.9, lat: 37.3}
    - {lon: 14.4, lat: 36.5}
    - {lon: 15.3, lat: 36.5}
  filter_domain: true

  group:
    size: 4
    radius_km: 1.0
    placement: random

  depth:
    enabled: false
    values: [0]

simulation:
  start_time: "2026-04-01 00:00"
  runtime_days: 2.0
  dt_hours: 0.1
  outputdt_hours: 1.0
  particle_type: scipy

lkm:
  enabled: false

output:
  zarr_name: ex02_point_list_grouped_2d.zarr
