experiment:
  name: med_cpf_singles_20260410-1200
  output_dir: ./outputs

fieldset:
  file_pattern: ./fields/mfs/hourly/sicily/med_currents_202604*.nc
  variables:
    U: uo
    V: vo
  dimensions:
    lon: longitude
    lat: latitude
    time: time
    # depth: depth
  mesh: spherical

release:
  mode: region_grid
  region_label: med_cpf
  dlon: 0.05
  dlat: 0.05
  filter_domain: true
  group:
    size: 1
    radius_km: 1.
    placement: random
  depth:
    enabled: false

simulation:
  start_time: "2026-04-10 12:00"
  particle_type: scipy
  runtime_days: 3
  dt_hours: 0.2
  outputdt_hours: 1

output:
  zarr_name: singles_cpf.zarr