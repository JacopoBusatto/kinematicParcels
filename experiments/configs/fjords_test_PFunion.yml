experiment:
  name: PNnf_surface_test
  output_dir: C:/Users/Jacopo/Documents/DATI/PATAGONIA/simulation

fieldset:
  file_pattern: C:/Users/Jacopo/Documents/DATI/PATAGONIA/ocean_uv_opendrift_final_V2.nc
  periodic_halo: false
  periodic_halo_size: 5
  variables:
    U: x_sea_water_velocity
    V: y_sea_water_velocity
  dimensions:
    lon: lon_rho
    lat: lat_rho
    time: time
    depth: depth
  mesh: spherical

release:
  mode: region_grid
  region_label: PFunion
  dlon: 0.05
  dlat: 0.05
  filter_domain: true # evita rilasciare particelle in punti dove non c'è campo (es. fuori dominio o in terra)

  depth:
    enabled: false
    values: [0]
    mode: snap_to_field          # as_requested | snap_to_field
    request_convention: positive_down
    snap_method: nearest
    remove_duplicate_depths: true

simulation:
  start_time: "2026-01-01 00:00"
  runtime_days: 2.8
  dt_hours: 0.1
  outputdt_hours: 1
  particle_type: scipy

output:
  zarr_name: output_PFall.zarr

