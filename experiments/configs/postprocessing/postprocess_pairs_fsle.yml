dataset:
  input_path: ./outputs/test_group_pairs.zarr

analysis:
  types:
    - summary
    - fsle
    - trajectories

output:
  output_dir: ./outputs/postprocessing/test_group_pairs_fsle

exports:
  save_trajectory_table: true
  save_particle_summary: true
  table_format: parquet

cleaning:
  truncate_stagnant: true
  stagnant_tol: 1.0e-6
  stagnant_min_consecutive: 2

release:
  mode: point_list
  continuous: false

fsle:
  pair_mode: center_pairs
  min_scale: 0.01
  max_scale: 5.0
  rho_increment: 1.4142135623730951
  save_crossing_events: true
  plot: true
  reference_slopes:
    - delta^-2/3
    - delta^-1
  reference_slope_anchor_scales:
    delta^-2/3: 0.5
    delta^-1: 2.0
  x_min: 0.01
  x_max: 5.0
  y_min: 1.0e-3
  y_max: 10.0

trajectories:
  plot: true
  animate: false
  title: "Grouped pairs for FSLE"
  show_start: true
  show_end: true
  max_group_member: 2

plotting:
  projection: PlateCarree