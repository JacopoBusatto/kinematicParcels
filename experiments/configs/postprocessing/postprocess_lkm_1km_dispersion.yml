dataset:
  input_path: ./test_output/lkm_1km_dispersion.zarr

analysis:
  types:
    - trajectories

output:
  output_dir: ./test_output/postprocessing/lkm_1km_dispersion

exports:
  save_trajectory_table: true
  save_particle_summary: true
  table_format: parquet

cleaning:
  truncate_stagnant: false
  stagnant_tol: 1.0e-6
  stagnant_min_consecutive: 2

grid:
  mode: from_initial_centers 
  lon_min: -5.0
  lon_max: 5.0
  lat_min: 40.0
  lat_max: 50.0
  dlon: 0.1
  dlat: 0.1

trajectories:
  plot: true
  animate: true
  title: "LKM 1km Dispersion - Grouped Trajectories"
  show_start: true
  show_end: true
  max_group_member: null

  animation_fps: 6
  animation_color_by: group_member
  animation_label: "group member"
  show_time_bar: true
  trail: true
  trail_steps: 20

plotting:
  projection: PlateCarree
