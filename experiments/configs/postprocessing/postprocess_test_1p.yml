dataset:
  input_path: ./outputs/one_trajectory_test.zarr

analysis:
  types:
    - summary
    - trajectories
    # - density
    # - beaching_times
    # - start_end_regions

output:
  output_dir: ./outputs/postprocessing/one_trajectory_test

exports:
  save_trajectory_table: true
  save_particle_summary: true
  table_format: parquet

cleaning:
  truncate_stagnant: true
  stagnant_tol: 1.0e-6
  stagnant_min_consecutive: 2

grid: # explicit_edges | from_initial_centers
  mode: from_initial_centers 
  lon_min: -73.65
  lon_max: -72.50
  lat_min: -52.45
  lat_max: -51.45
  dlon: 0.025
  dlat: 0.025

density:
  lon_col: lon
  lat_col: lat
  time_col: time
  normalize_active: true
  normalize_total: true

beaching_times:
  lon_col: lon0
  lat_col: lat0
  value_col: lifetime_seconds
  statistic: min
  plot: true

trajectories:
  plot: true
  title: "Live trajectories"
  show_start: true
  show_end: true

  animation_fps: 6
  animation_color_by: lat0
  animation_vmin: null
  animation_vmax: null
  animation_label: "initial latitude"
  show_time_bar: true
  trail: true
  trail_steps: 20

plotting:
  projection: PlateCarree

release:
  mode: point_list
  continuous: false

start_end_regions:
  region_labels: null
  how_many: priority_max
  priority_level: 6
  priority_mode: atleast
  input_lon_mode: "-180_180"
  plot: false  # no grid outputs for point_list release
  plot_connectivity: true
  animate_connectivity: false
  connectivity_segments: true