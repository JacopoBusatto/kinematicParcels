dataset:
  input_path: ./outputs/test_group_pairs.zarr

analysis:
  types:
    - trajectories

output:
  output_dir: ./outputs/postprocessing/test_group_pairs

exports:
  save_trajectory_table: true
  save_particle_summary: true
  table_format: parquet

cleaning:
  truncate_stagnant: true
  stagnant_tol: 1.0e-6
  stagnant_min_consecutive: 2

grid: # explicit_edges | from_initial_centers
  mode: from_initial_centers 
  lon_min: -73.65
  lon_max: -72.50
  lat_min: -52.45
  lat_max: -51.45
  dlon: 0.01
  dlat: 0.01

density:
  lon_col: lon
  lat_col: lat
  time_col: time
  normalize_active: true
  normalize_total: true
  fill_ever_active_empty_with_zero: true

  animate: true
  animation_var: particle_fraction_total
  animation_label: "density [%]"
  animation_fps: 6
  animation_vmin: 0
  animation_vmax: 0.05
  show_time_bar: true

beaching_times:
  lon_col: lon0
  lat_col: lat0
  value_col: lifetime_seconds
  statistic: min
  plot: true

trajectories:
  plot: true
  animate: true
  title: "Grouped Trajectories"
  show_start: true
  show_end: true
  max_group_member: null  # null = all members, or set to 1,2,3,etc to filter

  animation_fps: 3
  animation_color_by: lat0
  animation_label: "initial latitude"
  show_time_bar: true
  trail: true
  trail_steps: 20

plotting:
  projection: PlateCarree

start_end_regions:
  region_labels: null
  how_many: last
  priority_level: 6
  priority_mode: atleast
  input_lon_mode: "-180_180"
  plot: true