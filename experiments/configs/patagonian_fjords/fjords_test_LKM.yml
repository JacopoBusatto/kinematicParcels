experiment:
  name: fjords_test_LKM
  output_dir: C:/Users/Jacopo/Documents/DATI/PATAGONIA/simulation

fieldset:
  file_pattern: C:/Users/Jacopo/Documents/DATI/PATAGONIA/ocean_uv_opendrift_final_V2.nc
  periodic_halo: false
  periodic_halo_size: 5
  variables:
    U: x_sea_water_velocity
    V: y_sea_water_velocity
  dimensions:
    lon: lon_rho
    lat: lat_rho
    time: time
    depth: depth
  mesh: spherical

release:
  mode: region_grid
  region_label: PFunion
  dlon: 0.005
  dlat: 0.005
  filter_domain: true

  group:
    size: 4
    radius_km: 0.5

  depth:
    enabled: false
    values: [0]
    mode: snap_to_field
    request_convention: positive_down
    snap_method: nearest
    remove_duplicate_depths: true

simulation:
  start_time: "2026-01-01 00:00"
  runtime_days: 2.8
  dt_hours: 0.2
  outputdt_hours: 2
  particle_type: scipy

# LKM configuration
lkm:
  enabled: true
  mode: group_center_of_mass
  L_min_km: 0.15625
  L_max_km: 10.0
  increment_factor: 2.0
  epsilon_tke: 1.0e-9
  c0: 1.0
  phi_mode: constant
  phi_value: 0.78539816339  # π/4
  update_every_steps: 1
  apply_to_group_size_min: 2
  debug_output: false

output:
  zarr_name: output_LKM.zarr