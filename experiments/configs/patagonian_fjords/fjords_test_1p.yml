experiment:
  name: direct_points_test
  output_dir: ./outputs

fieldset:
  file_pattern: C:/Users/Jacopo/Documents/DATI/PATAGONIA/ocean_uv_opendrift_final_V2.nc
  periodic_halo: false
  periodic_halo_size: 5
  variables:
    U: x_sea_water_velocity
    V: y_sea_water_velocity
  dimensions:
    lon: lon_rho
    lat: lat_rho
    time: time
    depth: depth
  mesh: spherical

release:
  mode: point_list
  filter_domain: true
  filter_land: false

  points:
    - {lon: -72.80, lat: -51.90}

  depth:
    enabled: false
    values: [0]
    mode: snap_to_field
    request_convention: positive_down
    snap_method: nearest
    remove_duplicate_depths: true

simulation:
  runtime_days: 1
  dt_hours: 0.1
  outputdt_hours: 1
  particle_type: scipy

output:
  zarr_name: one_trajectory_test.zarr
